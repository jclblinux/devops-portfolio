- name: "Instalace python3-kubernetes přes APT"
  become: true
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present

- name: "Pridani helm prometheus-community repo"
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: "Zkopirovani monitoring-values.yml"
  ansible.builtin.copy:
    src: /home/administrator/devops-portfolio/helm/monitoring-values.yaml
    dest: /home/ubuntu/monitoring-values.yaml

- name: "Nasazeni monitoringu"
  kubernetes.core.helm:
    release_name: monitoring
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    values_files:
      - /home/ubuntu/monitoring-values.yaml
    kubeconfig: /home/ubuntu/.kube/config
