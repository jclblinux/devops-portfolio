---
- name: "APT update"
  become: true
  ansible.builtin.apt:
    update_cache: yes

- name: "Shell instalace k3s"
  become: true
  ansible.builtin.shell:
    cmd: "curl -sfL https://get.k3s.io | sh -"
    creates: /usr/local/bin/k3s

- name: "Shell k3s kubectl"
  become: true
  ansible.builtin.shell: 
    cmd: "k3s kubectl get nodes"
  retries: 10
  delay: 5
  register: result
  until: result.rc == 0

- name: "Vytvoreni adresare"
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    mode: "0755"
    group: ubuntu

- name: "Pridani KUBECONFIG do .bashrc"
  ansible.builtin.lineinfile:
    path: /home/ubuntu/.bashrc
    line: 'export KUBECONFIG=$HOME/.kube/config'
    regexp: '^export KUBECONFIG='
    state: present

- name: "Zkopirovani k3s kubeconfig"
  become: true
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: "0600"
