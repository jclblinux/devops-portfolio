---
- name: "Pridani bitnami repo"
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: "Zkopirovani postgresql-values.yml z localu na EC2"
  ansible.builtin.copy:
    src: "{{ project_root }}/helm/postgresql-values.yaml"
    dest: /home/ubuntu/postgresql-values.yaml

- name: "Nasazeni PostgreSQL pres Helm"
  kubernetes.core.helm:
    release_name: postgres
    chart_ref: bitnami/postgresql
    release_namespace: nodeapp
    create_namespace: true
    kubeconfig: /home/ubuntu/.kube/config
    values_files:
      - /home/ubuntu/postgresql-values.yaml
    values:
      auth:
        postgresPassword: "{{ postgres_admin_password }}"
        password: "{{ nodeapp_db_password }}"